version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: epms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: epms_user
      POSTGRES_PASSWORD: epms_pass
      POSTGRES_DB: epms_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U epms_user -d epms_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: epms-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
